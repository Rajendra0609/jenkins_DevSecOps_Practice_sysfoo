spring.application.name=sysfoo

# BUG FIX ("version was not updated completely"): this used to be a
# hardcoded string (app.version=1.0.0) with no connection at all to
# pom.xml's own <version> (0.0.1-SNAPSHOT) — two separate version numbers
# that had to be bumped by hand in two different files, and evidently
# weren't kept in sync. @project.version@ is Maven resource filtering
# (already enabled for application*.properties by spring-boot-starter-
# parent) — it's replaced with pom.xml's <version> at build time, so
# there's now exactly one place to bump the version.
app.version=@project.version@

# ── Actuator ──────────────────────────────────────────────────────────────
# BUG FIX: Dockerfile's HEALTHCHECK polls GET /actuator/health (see pom.xml
# comment for the missing-dependency half of this fix). Expose ONLY health
# over the web — never all endpoints — and never show dependency-level
# details (DB URLs, disk paths, etc.) on a route that SecurityConfig makes
# publicly reachable for the container/orchestrator probe.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── File uploads (task attachments, post images/files) ─────────────────────
# 20MB matches the requirement everywhere uploads are accepted (see
# FileStorageService for the per-feature type whitelist). max-request-size
# is a little above max-file-size to leave room for the other multipart
# form fields (title/content/etc.) alongside the file itself.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
# Where uploaded files are stored on disk. Override per-profile/environment
# (e.g. the Docker image points this at /data/uploads, alongside the SQLite
# file, so it survives on the same persistent volume — see Dockerfile).
app.upload-dir=./uploads

# ── File storage backend (see FileStorageBackend.java) ───────────────────
# CORRECTNESS FIX ("local disk file storage only... needs S3/MinIO/Blob
# storage for real horizontal scaling"): uploads are stored through a
# FileStorageBackend so a second, network-based implementation can be added
# without touching validation or Attachment records. Only "local" exists
# today — see FileStorageBackend's javadoc for exactly what an S3
# implementation would need (a new dependency + config here + a migration
# job for any files already on disk).
app.storage.backend=local

# ── SECURITY: session lifetime ───────────────────────────────────────────
# SECURITY FIX ("no session timeout/idle-expiry configuration"): an idle
# session is now automatically invalidated by the servlet container after
# this long. Combined with SecurityConfig's concurrent-session cap and
# AuthController's /api/auth/logout-everywhere, this closes the "I forgot
# to sign out on a shared computer" gap that had no time-based backstop
# before.
server.servlet.session.timeout=30m

# ── SECURITY: password policy ────────────────────────────────────────────
# Checks new passwords (registration + reset) against the Have I Been
# Pwned breach database via its k-anonymity range API — see
# PasswordPolicyService. The raw password never leaves this server; only a
# 5-character hash prefix is sent. Fails open (never blocks a user) if the
# API is unreachable. Set to false for fully offline/air-gapped deployments.
app.security.password.hibp-check-enabled=true

# ── SECURITY: optional CAPTCHA on registration ───────────────────────────
# SECURITY FIX ("no CAPTCHA or email verification on signup"): unset by
# default, exactly like the mail settings below — registration simply
# skips CAPTCHA verification until an operator sets a real
# reCAPTCHA secret from https://www.google.com/recaptcha/admin.
# The SITE key is public and safe to bake into the frontend; the SECRET
# key must only ever come from an environment variable, never be committed.
app.security.recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
app.security.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}

# ── Links embedded in verification/reset emails ──────────────────────────
# Must match wherever this app is actually reachable in a given
# environment (override in application-prod.properties / an env var) —
# used to build clickable "Reset Password" / "Verify Email" links.
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:8080}
spring.application.name=sysfoo

# BUG FIX ("version was not updated completely"): this used to be a
# hardcoded string (app.version=1.0.0) with no connection at all to
# pom.xml's own <version> (0.0.1-SNAPSHOT) — two separate version numbers
# that had to be bumped by hand in two different files, and evidently
# weren't kept in sync. @project.version@ is Maven resource filtering
# (already enabled for application*.properties by spring-boot-starter-
# parent) — it's replaced with pom.xml's <version> at build time, so
# there's now exactly one place to bump the version.
app.version=@project.version@

# ── Actuator ──────────────────────────────────────────────────────────────
# BUG FIX: Dockerfile's HEALTHCHECK polls GET /actuator/health (see pom.xml
# comment for the missing-dependency half of this fix). Expose ONLY health
# over the web — never all endpoints — and never show dependency-level
# details (DB URLs, disk paths, etc.) on a route that SecurityConfig makes
# publicly reachable for the container/orchestrator probe.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── File uploads (task attachments, post images/files) ─────────────────────
# 20MB matches the requirement everywhere uploads are accepted (see
# FileStorageService for the per-feature type whitelist). max-request-size
# is a little above max-file-size to leave room for the other multipart
# form fields (title/content/etc.) alongside the file itself.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
# Where uploaded files are stored on disk. Override per-profile/environment
# (e.g. the Docker image points this at /data/uploads, alongside the SQLite
# file, so it survives on the same persistent volume — see Dockerfile).
app.upload-dir=./uploads
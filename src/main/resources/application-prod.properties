# ──────────────────────────────────────────────────────────────────────────────
# PROD profile — PostgreSQL
# Activate with:  export SPRING_PROFILES_ACTIVE=prod
# Supply credentials via environment variables — never hard-code secrets here.
#
#   export SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/sysfoo
#   export SPRING_DATASOURCE_USERNAME=postgres
#   export SPRING_DATASOURCE_PASSWORD=secret
# ──────────────────────────────────────────────────────────────────────────────

# DataSource
# BUG FIX: the password used to fall back to a hardcoded "postgres" default
# (${SPRING_DATASOURCE_PASSWORD:postgres}) — a real secret should never have
# a checked-in default, even a "just for local testing" one: it's exactly
# the pattern secret scanners (Trivy/Black Duck/SonarQube) flag, and it's a
# genuine risk if SPRING_DATASOURCE_PASSWORD is ever accidentally left unset
# in a real deployment — the app would silently start against a guessable
# password instead of failing loudly. The URL and username aren't secrets,
# so they keep sensible fallbacks for local testing.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sysfoo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-test-query=SELECT 1

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# application-prod.properties
# SMTP configuration (override via environment variables)
# Example:
#   set SPRING_MAIL_USERNAME=your-email@gmail.com
#   set SPRING_MAIL_PASSWORD=your-app-password
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}

spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

# Fail fast (and log) if credentials are missing.
# Also enables STARTTLS for Gmail/Office365.
# If you still receive SMTP errors, check the password type (App Password / OAuth).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# From header (sender shown in inbox)
# If SYSFOO_MAIL_FROM is not set, build a sane default from SPRING_MAIL_USERNAME.
# If SPRING_MAIL_USERNAME is not set either, fall back to noreply@sysfoo.dev.
sysfoo.mail.from=${SYSFOO_MAIL_FROM:Sysfoo Dashboard <${SPRING_MAIL_USERNAME:noreply@sysfoo.dev}>}

# ── File uploads ──────────────────────────────────────────────────────────────
# No /data volume convention here (prod runs against Postgres, not a local
# SQLite file) — point this at wherever the deployment actually persists
# files, e.g. a mounted volume or network share.
app.upload-dir=${APP_UPLOAD_DIR:/var/sysfoo/uploads}



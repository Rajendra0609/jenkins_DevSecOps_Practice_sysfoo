# BUG FIX: this file was missing entirely from the uploaded project.
#
# mvnw / mvnw.cmd both hard-require .mvn/wrapper/maven-wrapper.properties to
# exist: it's where the wrapper (org.apache.maven.wrapper.MavenWrapperMain)
# reads `distributionUrl` from to know which Apache Maven build to download
# and run. Without it, EVERY `./mvnw ...` invocation fails immediately —
# which means any Jenkins/CI stage that runs `./mvnw clean test`,
# `./mvnw package`, etc. never gets past the very first command, regardless
# of whether the actual application code is fine. This is almost certainly
# why the "testing phase" wasn't reached as expected.
#
# Maven 3.9.6 matches the version already used in the Docker build stage
# (see Dockerfile: maven:3.9.6-eclipse-temurin-21-alpine), so local/CI
# builds now use the same Maven version as the container build.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.6/apache-maven-3.9.6-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.2.0/maven-wrapper-3.2.0.jar
